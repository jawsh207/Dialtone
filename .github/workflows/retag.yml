name: Retag

# One-off: after a history rewrite, move each release tag listed in .github/retag.txt
# ("vX.Y.Z <commit>") to its new commit. The GitHub Releases follow their tags.

on:
  push:
    branches: [main]
    paths: [".github/retag.txt"]

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move tags
        shell: bash
        run: |
          [ -f .github/retag.txt ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r tag sha; do
            [ -n "$tag" ] || continue
            git cat-file -e "${sha}^{commit}"
            git tag -f -a "$tag" -m "Dialtone $tag" "$sha"
            git push -f origin "refs/tags/$tag"
            echo "::notice title=Retagged $tag::$sha"
          done < .github/retag.txt
